# Faithful mimic of Uniswap/URCs .github/workflows/validate-urc.yml (same two steps,
# same interpolation of the step output into the shell). The final command is a
# harmless stand-in for scripts/validate_urc.py so the injection is visible.
name: validate (URC mimic)
on:
  pull_request:
    paths:
      - 'URCs/*.md'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed URC files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep '^URCs/.*\.md$' || true)
          echo "files<<EOF_DELIM" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF_DELIM" >> "$GITHUB_OUTPUT"
      - name: Validate URCs
        if: steps.changed.outputs.files != ''
        run: |
          python3 -c "print('would validate URC files')" ${{ steps.changed.outputs.files }}
